<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Một điều dành cho bạn</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#14081a;color:#fff}
body.flower{background:radial-gradient(circle at 50% 40%,#fff1f5,#ffd3e0 70%,#ffc2d4)}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.flower canvas{display:none}
#flower{position:absolute;left:50%;top:38%;width:min(78vw,52vh,360px);transform:translate(-50%,-50%);display:none}
body.flower #flower{display:block}
#flower svg{width:100%;height:auto;overflow:visible;animation:sway 5s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bloom{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.6s cubic-bezier(.2,.9,.25,1.2)}
#stage:not(.open) .bloom{transform:scale(.62,.86)}
#hint{position:absolute;left:0;right:0;top:70%;text-align:center;font-size:14px;letter-spacing:.3px;opacity:0;transition:opacity .8s;pointer-events:none}
#hint.show{opacity:.85}
body.flower #hint{color:#a8566f}
.open #hint{opacity:0}
#photos{position:absolute;inset:0;pointer-events:none}
.photo{position:absolute;width:clamp(74px,19vw,124px);padding:5px 5px 15px;background:#fff;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:0;transform:rotate(var(--r)) scale(.5);transition:opacity .9s var(--delay),transform .9s var(--delay);pointer-events:auto;cursor:zoom-in}
body.flower .photo{box-shadow:0 8px 20px rgba(190,70,110,.3)}
.open .photo{opacity:1;transform:rotate(var(--r)) scale(1)}
.photo .in{animation:drift var(--d) ease-in-out infinite alternate}
.photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:2px;background:#eee}
@keyframes drift{from{transform:translate(-5px,-7px)}to{transform:translate(6px,8px)}}
#card{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,24px);width:min(92vw,520px);max-height:36vh;overflow:auto;padding:16px 20px 18px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);text-align:center;opacity:0;pointer-events:none;transition:opacity .9s .5s,transform .9s .5s}
body.flower #card{background:rgba(255,255,255,.72);border-color:#fff;color:#7a2d48;box-shadow:0 10px 30px rgba(220,90,130,.25)}
.open #card{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card h1{margin:0 0 6px;font-size:21px;font-weight:700;color:#ff8fb0}
body.flower #card h1{color:#e0436f}
#card p{margin:0;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#music{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:none;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 10px;font:600 13px system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
#music i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ff6f97;font-style:normal;font-size:12px}
body.flower #music{color:#b33b60;background:rgba(255,255,255,.7)}
.open ~ #music{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
.fh{position:absolute;bottom:-30px;pointer-events:none;animation:rise var(--t) linear forwards;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-95vh) translateX(var(--x)) scale(1.1)}}
#loading,#lock,#err{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:#fff;color:#8a4b60}
#loading{transition:opacity .5s}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid #ffd0de;border-top-color:#f0507a;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#lock{background:linear-gradient(160deg,#ffe3ec,#ffc9d9)}
#lock h2{margin:0 0 4px;font-size:20px;color:#d63e69}
#lock input{margin-top:14px;width:170px;text-align:center;letter-spacing:12px;font-size:26px;padding:10px 4px 10px 16px;border:2px solid #f3b6c7;border-radius:14px;outline:none;color:#7a2d48}
#lock p{margin:8px 0 0;min-height:20px;color:#d63e69;font-size:14px}
#light{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:none;place-items:center;cursor:zoom-out}
#light img{max-width:92vw;max-height:88vh;border-radius:6px;box-shadow:0 10px 40px #000}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#flower svg,.photo .in{animation:none}}
</style>
</head>
<body>
<div id="loading"><div><div class="spin"></div>Loading</div></div>
<div id="err" hidden><div><h2>Link này không mở được 💔</h2><p>Có thể link bị cắt mất một đoạn. Hãy nhờ người gửi tạo lại nhé.</p></div></div>
<div id="lock" hidden><div><h2>Nhập mã để mở 💌</h2><div style="font-size:14px">Mã gồm 4 chữ số</div><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><p id="pinErr"></p></div></div>

<div id="stage">
  <canvas id="fx"></canvas>
  <div id="flower"></div>
  <p id="hint"></p>
  <div id="photos"></div>
  <section id="card"><h1 id="title"></h1><p id="msg"></p></section>
</div>
<button id="music" type="button"><i>♪</i><span>Play Music</span></button>
<div id="light"><img alt=""></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),body=document.body;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- đọc dữ liệu từ link: ?d=base64url(JSON utf-8) ---------- */
function decode(){
  var d=new URLSearchParams(location.search).get('d');
  if(!d)return null;
  d=d.replace(/-/g,'+').replace(/_/g,'/');
  while(d.length%4)d+='=';
  var bin=atob(d),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function safeUrl(u){
  try{var x=new URL(u);return(x.protocol==='https:'||x.protocol==='http:')?x.href:null}catch(e){return null}
}
var data;
try{data=decode()}catch(e){data=null}
if(!data||typeof data!=='object'){
  $('loading').hidden=true;$('err').hidden=false;return;
}
var style=data.s==='flower'?'flower':'heart';
var title=String(data.t||'').slice(0,60);
var msg=String(data.m||'').slice(0,400);
var imgs=(Array.isArray(data.i)?data.i:[]).map(safeUrl).filter(Boolean).slice(0,6);
var musicUrl=data.a?safeUrl(String(data.a)):null;
var pin=/^\d{4}$/.test(String(data.p||''))?String(data.p):'';
if(title)document.title=title;
if(style==='flower')body.classList.add('flower');
$('hint').textContent=style==='flower'?'Chạm vào hoa nhé 🌷':'Chạm vào trái tim nha ❤';

/* ---------- nhạc ---------- */
var audio=null,btn=$('music');
if(musicUrl){
  audio=new Audio();audio.src=musicUrl;audio.loop=true;audio.preload='none';
  btn.style.display='flex';
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    if(audio.paused)audio.play().catch(function(){});else audio.pause();
  });
  audio.addEventListener('play',function(){btn.querySelector('span').textContent='Pause'});
  audio.addEventListener('pause',function(){btn.querySelector('span').textContent='Play Music'});
}

/* ---------- ảnh bay ---------- */
var SLOTS=[[4,6],[70,5],[1,33],[75,30],[8,52],[68,50]];
imgs.forEach(function(u,i){
  var s=SLOTS[i],p=document.createElement('div');p.className='photo';
  p.style.left=(s[0]+Math.random()*4)+'%';p.style.top=(s[1]+Math.random()*4)+'%';
  p.style.setProperty('--r',((Math.random()*16-8)).toFixed(1)+'deg');
  p.style.setProperty('--delay',(0.4+i*0.35)+'s');
  p.style.setProperty('--d',(3.5+Math.random()*2.5).toFixed(1)+'s');
  var inn=document.createElement('div');inn.className='in';
  var im=document.createElement('img');im.alt='';im.referrerPolicy='no-referrer';im.src=u;
  im.onerror=function(){p.remove()};
  inn.appendChild(im);p.appendChild(inn);$('photos').appendChild(p);
  p.addEventListener('click',function(e){e.stopPropagation();var l=$('light');l.querySelector('img').src=u;l.style.display='grid'});
});
$('light').addEventListener('click',function(){this.style.display='none'});

/* ---------- trái tim hạt 3D: vòm vàng -> hội tụ -> chớp sáng -> tim đỏ rực ---------- */
var opened=false;
var cv=$('fx'),ctx=cv.getContext('2d',{alpha:true}),W=0,H=0,DPR=1,parts=[],motes=[],stars=[],hearts=[],scale=10,cx=0,cy=0,groundY=0,groundU=0,domeRx=0,domeRy=0;
var rotY=0,rotX=-0.12,dragging=false,downX=0,downY=0,lastPX=0,lastPY=0,dragDist=0;
var lastTime=0,raf=0,nextBurst=15,elapsed=0,burstUntil=0,mobile=false,spriteGold=null,spritePink=null;
var T_FORM=3.4,T_FLASH=5.2,T_RED=5.35,T_HINT=6.6;
var KEY={gold:[255,190,55],white:[255,243,212],red:[255,22,44],pink:[255,128,170]};
var PAL=[],PAL_N=24;
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function buildPalette(){
  PAL=[];
  for(var i=0;i<PAL_N;i++){
    var base=i<=8?mix(KEY.gold,KEY.white,i/8):mix(KEY.white,KEY.red,(i-8)/(PAL_N-9)),row=[];
    for(var v=0;v<8;v++){
      var c=base;
      if(i>12&&v>=5)c=mix(base,KEY.pink,.35+.12*(v-5));
      var k=.62+.38*(v/7);
      row.push('rgb('+Math.round(c[0]*k)+','+Math.round(c[1]*k)+','+Math.round(c[2]*k)+')');
    }
    PAL.push(row);
  }
}
function heartSprite(rgb){
  var s=document.createElement('canvas'),n=48;s.width=s.height=n;var g=s.getContext('2d');
  g.translate(n/2,n/2+2);g.scale(1.1,1.1);
  var gr=g.createRadialGradient(0,-2,1,0,-2,22);gr.addColorStop(0,'rgba('+rgb+',.55)');gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr;g.fillRect(-24,-24,48,48);
  g.beginPath();g.moveTo(0,10);g.bezierCurveTo(-16,-1,-10,-14,0,-6);g.bezierCurveTo(10,-14,16,-1,0,10);g.closePath();
  g.fillStyle='rgb('+rgb+')';g.fill();
  return s;
}
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W*.86,H*.57)/36;cx=W/2;cy=H*.40;
  groundY=H*.80;groundU=(groundY-cy)/scale;
  domeRx=Math.min(W*.30,230)/scale;domeRy=domeRx*.62;
  $('hint').style.top=(groundY+16)+'px';
}
/* điểm trên trái tim "phồng" (như gối): lấy mẫu loại trừ theo đường cong ẩn nên phủ đều, mặt trước + sau, ít hạt trong ruột */
function heartF(x,y){var q=x*x+y*y-1;return q*q*q-x*x*y*y*y}
function heartPoint(){
  var x,y,f,g=0,edge=Math.random()<.13;
  do{x=(Math.random()*2-1)*1.15;y=Math.random()*2.3-1.02;f=heartF(x,y);g++}
  while((edge?(f>0||f<-.05):f>0)&&g<80);
  if(g>=80){x=0;y=.3;f=heartF(x,y)}
  var d=Math.min(1,-f),th=Math.sqrt(Math.max(0,d)),T=7.4,z;
  if(Math.random()<.12)z=(Math.random()*2-1)*T*th*.8;
  else z=(Math.random()<.5?-1:1)*T*th*(.93+Math.random()*.07);
  return{x:x*14.05,y:-12+(1.25-y)*12.9,z:z};
}
function build(){
  mobile=W<700||('ontouchstart' in window);
  var N=mobile?5200:10500,M=mobile?300:560;
  parts.length=0;motes.length=0;stars.length=0;hearts.length=0;
  var skip=reduce;
  for(var i=0;i<N;i++){
    var q=heartPoint(),a=Math.random()*3.14159,f=Math.random()<.45?.86+Math.random()*.14:Math.pow(Math.random(),.55)*.86;
    var dx=Math.cos(a)*domeRx*f,dy=groundU-Math.sin(a)*domeRy*f;
    parts.push({tx:q.x,ty:q.y,tz:q.z,dx:dx,dy:dy,dz:(Math.random()-.5)*7,
      x:skip?q.x:dx*(.6+Math.random()*.8),y:skip?q.y:groundU+Math.random()*.6,z:skip?q.z:(Math.random()-.5)*7,
      vx:0,vy:0,vz:0,sz:(Math.random()<.12?2.3:1.45)+Math.random()*.9,
      ph:Math.random()*6.283,sp:.7+Math.random()*1.8,v:(Math.random()*8)|0});
  }
  for(var m=0;m<M;m++)motes.push({x:(Math.random()-.5)*W*1.02,j:Math.random(),rise:Math.random()<.22?(18+Math.random()*120):0,ph:Math.random()*6.283,sp:.5+Math.random()*2,sz:.7+Math.random()*1.4,v:(Math.random()*8)|0,sd:Math.random()});
  for(var s=0;s<(mobile?55:100);s++)stars.push({x:Math.random(),y:Math.random()*.8,r:.2+Math.random()*.9,ph:Math.random()*6.28,sp:.4+Math.random()*1.2});
  for(var h=0;h<(mobile?12:20);h++)hearts.push({x:Math.random(),y:Math.random(),s:7+Math.random()*13,sp:16+Math.random()*30,ph:Math.random()*6.28,w:8+Math.random()*16});
  elapsed=skip?T_HINT+1:0;nextBurst=elapsed+15;
  if(!spriteGold){spriteGold=heartSprite('255,200,70');spritePink=heartSprite('255,105,150')}
}
function burst(power){
  burstUntil=elapsed+1.05;
  for(var i=0;i<parts.length;i++){
    var p=parts[i],ax=p.tx/16+(Math.random()-.5)*.65,ay=p.ty/16+(Math.random()-.5)*.65,az=p.tz/8+(Math.random()-.5)*.8;
    var d=Math.sqrt(ax*ax+ay*ay+az*az)||1,m=(5+Math.random()*8)*(power||1);
    p.vx+=ax/d*m;p.vy+=ay/d*m;p.vz+=az/d*m;
  }
}
/* kéo để xoay (không dùng khi chọn kiểu hoa) */
stage.addEventListener('pointerdown',function(e){
  downX=lastPX=e.clientX;downY=lastPY=e.clientY;dragDist=0;
  if(style==='heart'){dragging=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}}
});
stage.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var dx=e.clientX-lastPX,dy=e.clientY-lastPY;lastPX=e.clientX;lastPY=e.clientY;
  dragDist=Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY);
  rotY+=dx*.009;rotX=Math.max(-1.1,Math.min(1.1,rotX+dy*.006));
});
function endPointer(e){
  var wasDrag=dragDist>9;dragging=false;
  if(e.type==='pointerup'&&!wasDrag)open();
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',function(){dragging=false});

function frame(now){
  if(!lastTime)lastTime=now;
  var dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;elapsed+=dt;
  var e=elapsed,k=dt*60;
  ctx.clearRect(0,0,W,H);
  /* chỉ số màu: vàng -> trắng vàng -> đỏ */
  var ci=e<T_FORM-.2?0:(e<T_RED?Math.round((e-(T_FORM-.2))/(T_RED-(T_FORM-.2))*8):8+Math.round(Math.min(1,(e-T_RED)/1.5)*(PAL_N-9)));
  var pal=PAL[ci],redness=e<T_RED?0:Math.min(1,(e-T_RED)/1.5);
  var intro=Math.min(1,e/1.1);
  /* sao nền */
  for(var i=0;i<stars.length;i++){var st=stars[i];ctx.globalAlpha=(.12+.34*Math.abs(Math.sin(e*st.sp+st.ph)))*intro;ctx.fillStyle='#fff';ctx.fillRect(st.x*W,st.y*H,st.r*1.6,st.r*1.6)}
  ctx.globalCompositeOperation='lighter';
  /* quầng sáng */
  var domeG=Math.min(1,e/2.8);domeG=1-Math.pow(1-domeG,3);
  if(e<T_RED+.3){
    var ha=(e<T_FORM?.3*domeG:.3*(1-Math.min(1,(e-T_FORM)/(T_RED-T_FORM))*.5)),hy=e<T_FORM?groundY-domeRy*scale*.45*domeG:groundY+(cy-groundY)*Math.min(1,Math.max(0,(e-T_FORM)/(T_FLASH-T_FORM)));
    var hr=Math.max(40,domeRx*scale*(1.1+.5*(e>T_FORM?Math.min(1,(e-T_FORM)/1.8):0)));
    var gr=ctx.createRadialGradient(cx,hy,0,cx,hy,hr);gr.addColorStop(0,'rgba(255,205,90,'+ha+')');gr.addColorStop(1,'rgba(255,170,40,0)');
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(cx-hr,hy-hr,hr*2,hr*2);
  }
  if(redness>0){
    var beatH=1+Math.pow(Math.max(0,Math.sin(e*2.4)),8)*.05,rr=21*scale*beatH;
    var g2=ctx.createRadialGradient(cx,cy,rr*.15,cx,cy,rr);g2.addColorStop(0,'rgba(255,25,60,'+(.42*redness)+')');g2.addColorStop(.55,'rgba(255,20,70,'+(.18*redness)+')');g2.addColorStop(1,'rgba(255,20,70,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g2;ctx.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  }
  /* mặt đất lấp lánh + hạt bay lên */
  for(var m=0;m<motes.length;m++){
    var mo=motes[m],cyc=(e*.07*(mo.sp)+mo.sd)%1,yy=groundY+(mo.j-.5)*7;
    if(mo.rise)yy-=cyc*mo.rise*Math.min(1,e/1.5);
    var al=(mo.rise?(1-cyc):1)*(.25+.6*Math.abs(Math.sin(e*mo.sp*1.6+mo.ph)))*intro*(1-Math.abs(mo.x)/(W*.62));
    ctx.globalAlpha=Math.max(0,al);ctx.fillStyle=pal[mo.v];ctx.fillRect(cx+mo.x,yy,mo.sz,mo.sz);
  }
  /* trái tim hạt */
  if(e>=nextBurst&&e>T_HINT){burst(1);nextBurst=e+14}
  if(!dragging)rotY+=dt*(e<T_FORM?0:.22*Math.min(1,(e-T_FORM)/2));
  var exploding=e<burstUntil,spring,damp;
  if(e<T_FORM){spring=.022;damp=.86}
  else if(exploding){spring=.0045;damp=.975}
  else if(e<T_RED){spring=.012+.03*Math.min(1,(e-T_FORM)/1.6);damp=.86}
  else{spring=.018;damp=.82}
  damp=Math.pow(damp,k);var sk=spring*k;
  var cyaw=Math.cos(rotY),syaw=Math.sin(rotY),cp=Math.cos(rotX),sp=Math.sin(rotX);
  var beat=1+(e>T_RED?Math.pow(Math.max(0,Math.sin(e*2.4)),8)*.045:0);
  var toDome=e<T_FORM;
  for(var j=0;j<parts.length;j++){
    var p=parts[j],tx,ty,tz;
    if(toDome){tx=p.dx*domeG;ty=groundU+(p.dy-groundU)*domeG-Math.sin(e*2+p.ph)*.5;tz=p.dz}
    else{tx=p.tx;ty=p.ty;tz=p.tz}
    p.vx=(p.vx+(tx-p.x)*sk)*damp;p.vy=(p.vy+(ty-p.y)*sk)*damp;p.vz=(p.vz+(tz-p.z)*sk)*damp;
    p.x+=p.vx*k;p.y+=p.vy*k;p.z+=p.vz*k;
    var rx=p.x*cyaw+p.z*syaw,rz=-p.x*syaw+p.z*cyaw;
    var ry=p.y*cp-rz*sp,rz2=p.y*sp+rz*cp;
    var persp=430/(430-rz2*scale*.62),px=cx+rx*scale*persp*(toDome?1:beat),py=cy+ry*scale*persp*(toDome?1:beat);
    var depth=.34+.66*Math.max(0,Math.min(1,(rz2+7)/14));
    var al=(.55+.45*Math.abs(Math.sin(e*p.sp+p.ph)))*depth*intro*(e>T_RED?1.18:1);
    ctx.globalAlpha=al>1?1:al;ctx.fillStyle=pal[p.v];
    var r=p.sz*persp;
    if(r<1.35)ctx.fillRect(px-r*.5,py-r*.5,r,r);else{ctx.beginPath();ctx.arc(px,py,r*.6,0,6.283);ctx.fill()}
  }
  /* tim nhỏ bay lên (vàng, rồi hồng) */
  if(e>1.8){
    var sprite=ci<12?spriteGold:spritePink,fa=Math.min(1,(e-1.8)/1.5);
    for(var h=0;h<hearts.length;h++){
      var ht=hearts[h],yy2=((ht.y*H*1.1-(e*ht.sp))%(H*.95)+H*.95)%(H*.95)+H*.02,xx=ht.x*W+Math.sin(e*.8+ht.ph)*ht.w;
      var ya=Math.min(1,Math.max(0,(groundY+30-yy2)/90));
      ctx.globalAlpha=(.25+.6*Math.abs(Math.sin(e*.9+ht.ph)))*fa*ya;ctx.drawImage(sprite,xx-ht.s,yy2-ht.s,ht.s*2,ht.s*2);
    }
  }
  /* chớp sáng khi tim hình thành */
  if(e>T_FORM+.6&&e<T_RED+1.3){
    var fl=e<T_FLASH?Math.pow((e-(T_FORM+.6))/(T_FLASH-(T_FORM+.6)),2.2):Math.max(0,1-(e-T_FLASH)/1.1);
    var fr=Math.max(W,H)*(.28+.4*fl),g3=ctx.createRadialGradient(cx,cy,0,cx,cy,fr);
    g3.addColorStop(0,'rgba(255,250,235,'+(.95*fl)+')');g3.addColorStop(.35,'rgba(255,225,150,'+(.5*fl)+')');g3.addColorStop(1,'rgba(255,200,100,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g3;ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(e>T_HINT&&!opened)$('hint').classList.add('show');
  raf=requestAnimationFrame(frame);
}
/* ---------- bó hoa (SVG tự vẽ) ---------- */
function tulip(x,y,s,rot,c1,c2){
  return '<path d="M'+x+' '+y+' C'+x+' '+(y+90)+' 150 250 150 330" stroke="#5aa467" stroke-width="4.5" fill="none" stroke-linecap="round"/>'+
  '<g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><g class="bloom">'+
  '<path d="M-22 0C-27 -30 -14 -54 0 -64C14 -54 27 -30 22 0C12 9 -12 9 -22 0Z" fill="'+c2+'"/>'+
  '<path d="M-22 0C-25 -26 -13 -47 -3 -60C-5 -32 -3 -10 1 7C-10 7 -19 4 -22 0Z" fill="'+c1+'"/>'+
  '<path d="M22 0C25 -26 13 -47 3 -60C5 -32 3 -10 -1 7C10 7 19 4 22 0Z" fill="'+c1+'" opacity=".93"/>'+
  '</g></g>';
}
function drawFlower(){
  var g='<defs><linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f5"/><stop offset=".48" stop-color="#ff9fbd"/><stop offset="1" stop-color="#e94d83"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5f5c9"/><stop offset="1" stop-color="#27875a"/></linearGradient><radialGradient id="petalGlow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ff6f9a" stop-opacity="0"/></radialGradient><filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  g+='<ellipse cx="150" cy="290" rx="105" ry="118" fill="url(#petalGlow)" opacity=".6"/>'; 
  g+='<path d="M150 330C110 290 70 280 52 238C98 240 136 275 150 330Z" fill="url(#leaf)"/>';
  g+='<path d="M150 330C190 290 230 280 248 238C202 240 164 275 150 330Z" fill="url(#leaf)"/>';
  g+=tulip(64,222,1.12,-26,'#ff8fb1','#ffd3e0');
  g+=tulip(236,222,1.12,26,'#ff7ea6','#ffc4d7');
  g+=tulip(104,172,1.3,-12,'#ffffff','#ffe3ec');
  g+=tulip(196,172,1.3,12,'#ff9db9','#ffd8e3');
  g+=tulip(150,138,1.5,0,'#ff6f9a','#ffb7cd');
  g+='<path d="M72 252Q150 232 228 252L170 396Q150 405 130 396Z" fill="url(#wrap)" stroke="#fff0f5" stroke-width="2"/>';
  g+='<path d="M72 252Q112 300 130 396L150 330Z" fill="#ffb3c8" opacity=".75"/>';
  g+='<path d="M228 252Q188 300 170 396L150 330Z" fill="#ffd9e4" opacity=".8"/>';
  g+='<path d="M150 372C140 363 134 357 134 350C134 345 138 342 142 342C146 342 149 345 150 347C151 345 154 342 158 342C162 342 166 345 166 350C166 357 160 363 150 372Z" fill="#f0507a"/>';
  g+='<path d="M120 296Q150 306 180 296" stroke="#f0507a" stroke-width="5" fill="none" stroke-linecap="round"/>';
  g+='<g fill="#fff" filter="url(#softGlow)" opacity=".9"><circle cx="78" cy="170" r="2.4"/><circle cx="220" cy="160" r="2"/><circle cx="150" cy="95" r="2.8"/><circle cx="105" cy="245" r="1.8"/><circle cx="205" cy="225" r="2.2"/></g>';
  $('flower').innerHTML='<svg viewBox="0 0 300 420" aria-hidden="true">'+g+'</svg>';
  $('hint').style.top=($('flower').getBoundingClientRect().bottom+8)+'px';
}

/* ---------- mở lời chúc ---------- */
function floatHearts(){
  if(reduce)return;
  var n=0,iv=setInterval(function(){
    var h=document.createElement('div');h.className='fh';h.textContent=style==='flower'?(Math.random()<.5?'🌸':'💗'):'❤';
    h.style.left=(Math.random()*96)+'%';h.style.fontSize=(14+Math.random()*16)+'px';
    h.style.color='#ff6f97';h.style.setProperty('--t',(5+Math.random()*4)+'s');h.style.setProperty('--x',(Math.random()*60-30)+'px');
    stage.appendChild(h);setTimeout(function(){h.remove()},9500);
    if(++n>60)clearInterval(iv);
  },380);
}
function typeText(el,text){
  var chars=Array.from(text);el.textContent='';
  if(reduce||chars.length>300){el.textContent=text;return}
  var i=0,iv=setInterval(function(){el.textContent+=chars[i++];if(i>=chars.length)clearInterval(iv)},38);
}
function open(){
  if(opened)return;opened=true;stage.classList.add('open');
  if(style==='heart')burst();
  $('title').textContent=title;$('title').hidden=!title;
  typeText($('msg'),msg);floatHearts();
  if(audio&&audio.paused)audio.play().catch(function(){});
}

/* ---------- khởi động ---------- */
function start(){
  if(style==='heart'){buildPalette();resize();build();lastTime=0;raf=requestAnimationFrame(frame);var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var w=W;resize();if(Math.abs(w-innerWidth)>40||!parts.length){var el=elapsed;build();elapsed=Math.max(el,T_HINT+1)}},150)})}
  else{drawFlower();$('hint').classList.add('show')}
  var l=$('loading');l.style.opacity='0';setTimeout(function(){l.hidden=true},500);
}
document.addEventListener('visibilitychange',function(){
  if(style!=='heart')return;
  if(document.hidden){cancelAnimationFrame(raf);lastTime=0}else{lastTime=0;raf=requestAnimationFrame(frame)}
});
setTimeout(function(){
  if(pin){
    $('loading').hidden=true;var lk=$('lock');lk.hidden=false;var inp=$('pin');
    inp.addEventListener('input',function(){
      inp.value=inp.value.replace(/\D/g,'');
      if(inp.value.length===4){
        if(inp.value===pin){lk.hidden=true;$('loading').hidden=false;$('loading').style.opacity='1';start()}
        else{$('pinErr').textContent='Chưa đúng mã rồi, thử lại nhé 🥺';inp.value=''}
      }
    });
  }else start();
},reduce?0:700);
})();
</script>
