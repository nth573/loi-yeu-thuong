<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Một điều dành cho bạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#14081a;color:#fff}
body.flower{background:radial-gradient(circle at 50% 40%,#fff1f5,#ffd3e0 70%,#ffc2d4)}
#stage{position:fixed;inset:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.heartmode #card{display:none}
#letter{position:absolute;inset:0;pointer-events:none}
.pol{position:absolute;left:0;top:0;width:var(--w);margin:calc(var(--w)*-.5 - 10px) 0 0 calc(var(--w)*-.5);padding:5px 5px 14px;background:#fff;border-radius:3px;box-shadow:0 8px 26px rgba(255,90,150,.4),0 2px 8px rgba(0,0,0,.5);opacity:0;transform:translate(var(--sx),var(--sy)) scale(.2) rotate(0deg);transition:transform 1.5s cubic-bezier(.2,.9,.25,1.05) var(--dl),opacity .8s var(--dl);pointer-events:auto;cursor:zoom-in}
.pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#222;border-radius:1px}
#letter.go .pol{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--r))}
#txt{position:absolute;left:50%;transform:translateX(-50%);width:min(88vw,440px);padding:10px 8px;text-align:left;isolation:isolate;font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;color:#ffc6dc;text-shadow:0 0 10px rgba(255,70,140,.6),0 1px 2px #000;pointer-events:none}
#txt::before{content:"";position:absolute;inset:-16px -12px;z-index:-1;background:radial-gradient(ellipse at 50% 50%,rgba(14,3,16,.72),rgba(14,3,16,0) 72%)}
#txt .h{margin:0 0 8px;font-size:clamp(25px,7vw,33px);font-weight:600;color:#ffe0ec}
#txt p{margin:0 0 6px;font-size:clamp(17px,4.7vw,21px);line-height:1.45;font-weight:500;word-break:break-word}
#txt .c::after{content:"|";margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.flower canvas{display:none}
#flower{position:absolute;left:50%;top:38%;width:min(78vw,52vh,360px);transform:translate(-50%,-50%);display:none}
body.flower #flower{display:block}
#flower svg{width:100%;height:auto;overflow:visible;animation:sway 5s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bloom{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.6s cubic-bezier(.2,.9,.25,1.2)}
#stage:not(.open) .bloom{transform:scale(.62,.86)}
#hint{position:absolute;left:0;right:0;top:70%;text-align:center;font-size:14px;letter-spacing:.3px;opacity:0;transition:opacity .8s;pointer-events:none}
#hint.show{opacity:.85}
body.flower #hint{color:#a8566f}
.open #hint{opacity:0}
#photos{position:absolute;inset:0;pointer-events:none}
.photo{position:absolute;width:clamp(74px,19vw,124px);padding:5px 5px 15px;background:#fff;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:0;transform:rotate(var(--r)) scale(.5);transition:opacity .9s var(--delay),transform .9s var(--delay);pointer-events:auto;cursor:zoom-in}
body.flower .photo{box-shadow:0 8px 20px rgba(190,70,110,.3)}
.open .photo{opacity:1;transform:rotate(var(--r)) scale(1)}
.photo .in{animation:drift var(--d) ease-in-out infinite alternate}
.photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:2px;background:#eee}
@keyframes drift{from{transform:translate(-5px,-7px)}to{transform:translate(6px,8px)}}
#card{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,24px);width:min(92vw,520px);max-height:36vh;overflow:auto;padding:16px 20px 18px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);text-align:center;opacity:0;pointer-events:none;transition:opacity .9s .5s,transform .9s .5s}
body.flower #card{background:rgba(255,255,255,.72);border-color:#fff;color:#7a2d48;box-shadow:0 10px 30px rgba(220,90,130,.25)}
.open #card{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card h1{margin:0 0 6px;font-size:21px;font-weight:700;color:#ff8fb0}
body.flower #card h1{color:#e0436f}
#card p{margin:0;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#music{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:none;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 10px;font:600 13px system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
#music i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ff6f97;font-style:normal;font-size:12px}
body.flower #music{color:#b33b60;background:rgba(255,255,255,.7)}
.open ~ #music{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
.fh{position:absolute;bottom:-30px;pointer-events:none;animation:rise var(--t) linear forwards;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-95vh) translateX(var(--x)) scale(1.1)}}
#loading,#lock,#err{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:#fff;color:#8a4b60}
#loading{transition:opacity .5s}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid #ffd0de;border-top-color:#f0507a;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#lock{background:linear-gradient(160deg,#ffe3ec,#ffc9d9)}
#lock h2{margin:0 0 4px;font-size:20px;color:#d63e69}
#lock input{margin-top:14px;width:170px;text-align:center;letter-spacing:12px;font-size:26px;padding:10px 4px 10px 16px;border:2px solid #f3b6c7;border-radius:14px;outline:none;color:#7a2d48}
#lock p{margin:8px 0 0;min-height:20px;color:#d63e69;font-size:14px}
#light{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:none;place-items:center;cursor:zoom-out}
#light img{max-width:92vw;max-height:88vh;border-radius:6px;box-shadow:0 10px 40px #000}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#flower svg,.photo .in{animation:none}}
</style>
</head>
<body>
<div id="loading"><div><div class="spin"></div>Loading</div></div>
<div id="err" hidden><div><h2>Link này không mở được 💔</h2><p>Có thể link bị cắt mất một đoạn. Hãy nhờ người gửi tạo lại nhé.</p></div></div>
<div id="lock" hidden><div><h2>Nhập mã để mở 💌</h2><div style="font-size:14px">Mã gồm 4 chữ số</div><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><p id="pinErr"></p></div></div>

<div id="stage">
  <canvas id="fx"></canvas>
  <div id="flower"></div>
  <p id="hint"></p>
  <div id="photos"></div>
  <div id="letter"></div>
  <section id="card"><h1 id="title"></h1><p id="msg"></p></section>
</div>
<button id="music" type="button"><i>♪</i><span>Play Music</span></button>
<div id="light"><img alt=""></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),body=document.body;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- đọc dữ liệu từ link: ?d=base64url(JSON utf-8) ---------- */
function decode(){
  var d=new URLSearchParams(location.search).get('d');
  if(!d)return null;
  d=d.replace(/-/g,'+').replace(/_/g,'/');
  while(d.length%4)d+='=';
  var bin=atob(d),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function safeUrl(u){
  try{var x=new URL(u);return(x.protocol==='https:'||x.protocol==='http:')?x.href:null}catch(e){return null}
}
var data;
try{data=decode()}catch(e){data=null}
if(!data||typeof data!=='object'){
  $('loading').hidden=true;$('err').hidden=false;return;
}
var style=data.s==='flower'?'flower':'heart';
var title=String(data.t||'').slice(0,60);
var msg=String(data.m||'').slice(0,400);
var imgs=(Array.isArray(data.i)?data.i:[]).map(safeUrl).filter(Boolean).slice(0,6);
var musicUrl=data.a?safeUrl(String(data.a)):null;
var pin=/^\d{4}$/.test(String(data.p||''))?String(data.p):'';
if(title)document.title=title;
if(style==='flower')body.classList.add('flower');else body.classList.add('heartmode');
$('hint').textContent=style==='flower'?'Chạm vào hoa nhé 🌷':'Chạm vào trái tim nha ❤';

/* ---------- nhạc ---------- */
var audio=null,btn=$('music');
if(musicUrl){
  audio=new Audio();audio.src=musicUrl;audio.loop=true;audio.preload='none';
  btn.style.display='flex';
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    if(audio.paused)audio.play().catch(function(){});else audio.pause();
  });
  audio.addEventListener('play',function(){btn.querySelector('span').textContent='Pause'});
  audio.addEventListener('pause',function(){btn.querySelector('span').textContent='Play Music'});
}

/* ---------- ảnh bay ---------- */
var SLOTS=[[4,6],[70,5],[1,33],[75,30],[8,52],[68,50]];
(style==='flower'?imgs:[]).forEach(function(u,i){
  var s=SLOTS[i],p=document.createElement('div');p.className='photo';
  p.style.left=(s[0]+Math.random()*4)+'%';p.style.top=(s[1]+Math.random()*4)+'%';
  p.style.setProperty('--r',((Math.random()*16-8)).toFixed(1)+'deg');
  p.style.setProperty('--delay',(0.4+i*0.35)+'s');
  p.style.setProperty('--d',(3.5+Math.random()*2.5).toFixed(1)+'s');
  var inn=document.createElement('div');inn.className='in';
  var im=document.createElement('img');im.alt='';im.referrerPolicy='no-referrer';im.src=u;
  im.onerror=function(){p.remove()};
  inn.appendChild(im);p.appendChild(inn);$('photos').appendChild(p);
  p.addEventListener('click',function(e){e.stopPropagation();var l=$('light');l.querySelector('img').src=u;l.style.display='grid'});
});
$('light').addEventListener('click',function(){this.style.display='none'});

/* ---------- vòm vàng -> tim vàng -> tim đỏ (không xoay) -> chạm: lá thư bằng hạt -> chạm: ảnh + chữ gõ từng dòng ---------- */
var opened=false;
var cv=$('fx'),ctx=cv.getContext('2d',{alpha:true}),W=0,H=0,DPR=1,parts=[],motes=[],stars=[],hearts=[],floats=[],thumbs=[],scale=10,cx=0,cy=0,groundY=0,groundU=0,domeRx=0,domeRy=0;
var envW=0,envH=0,envCy=0,envTop=0,etU=0,bnd=[];
var lastTime=0,raf=0,elapsed=0,mobile=false,sprites=null,phase=0,tPh=0,t4=0,flashT=-9,ciCur=0,hint1=false,typeTimers=[],typingDone=true,letterBuilt=false;
var T_FORM=3.4,T_FLASH=5.2,T_RED=5.35,T_HINT=6.6;
var LX=-.45,LY=-.55,LZ=.7; /* ánh sáng từ trên-trái-phía trước (đổ bóng phần bo tròn của tim) */
var KEY={gold:[255,190,55],white:[255,243,212],red:[255,22,44],pink:[255,128,170]};
var PAL=[],PALP=[],PAL_N=24;
function clamp01(x){return x<0?0:x>1?1:x}
function ease3(t){return 1-Math.pow(1-t,3)}
function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function buildPalette(){
  PAL=[];PALP=[];
  for(var q=0;q<8;q++){var kk=.7+.3*(q/7),cc=q<5?mix([255,92,150],[255,150,190],q/4):mix([255,150,190],[255,226,238],(q-4)/3);PALP.push('rgb('+Math.round(cc[0]*kk)+','+Math.round(cc[1]*kk)+','+Math.round(cc[2]*kk)+')')}
  for(var i=0;i<PAL_N;i++){
    var base=i<=8?mix(KEY.gold,KEY.white,i/8):mix(KEY.white,KEY.red,(i-8)/(PAL_N-9)),row=[];
    for(var v=0;v<8;v++){
      var c=base;
      if(i>12&&v>=5)c=mix(base,KEY.pink,.35+.12*(v-5));
      var k=.62+.38*(v/7);
      row.push('rgb('+Math.round(c[0]*k)+','+Math.round(c[1]*k)+','+Math.round(c[2]*k)+')');
    }
    PAL.push(row);
  }
}
function heartSprite(rgb){
  var s=document.createElement('canvas'),n=48;s.width=s.height=n;var g=s.getContext('2d');
  g.translate(n/2,n/2+2);g.scale(1.1,1.1);
  var gr=g.createRadialGradient(0,-2,1,0,-2,22);gr.addColorStop(0,'rgba('+rgb+',.55)');gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr;g.fillRect(-24,-24,48,48);
  g.beginPath();g.moveTo(0,10);g.bezierCurveTo(-16,-1,-10,-14,0,-6);g.bezierCurveTo(10,-14,16,-1,0,10);g.closePath();
  g.fillStyle='rgb('+rgb+')';g.fill();
  return s;
}

/* ---- khối trái tim phồng: z theo khoảng cách d tới mép, mặt cắt 1/4 đường tròn nên mép bo tròn; chỉ cần mặt trước vì không xoay ---- */
var BEVEL=8.5,THICK=7.6,DOME=2.2,GX0=-18,GX1=18,GY0=-14,GY1=19,GN=110,dgrid=null;
function buildBoundary(){
  var n=720,pts=[],i;
  for(i=0;i<=n;i++){var t=i/n*6.2832,sn=Math.sin(t);pts.push({x:16*sn*sn*sn,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))})}
  bnd=pts;
}
function buildDistGrid(){
  if(!bnd.length)buildBoundary();
  var B=[],i,j,k,n=bnd.length-1;for(i=0;i<n;i+=3)B.push(bnd[i]);
  var m=B.length;dgrid=new Float32Array(GN*GN);
  for(j=0;j<GN;j++)for(i=0;i<GN;i++){
    var x=GX0+(GX1-GX0)*i/(GN-1),y=GY0+(GY1-GY0)*j/(GN-1),inside=false,dm=1e9;
    for(k=0;k<m;k++){
      var a=B[k],b=B[(k+1)%m],dx=b.x-a.x,dy=b.y-a.y;
      if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)inside=!inside;
      var t=((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1);t=t<0?0:t>1?1:t;
      var ex=x-(a.x+dx*t),ey=y-(a.y+dy*t),d2=ex*ex+ey*ey;if(d2<dm)dm=d2;
    }
    dgrid[j*GN+i]=inside?Math.sqrt(dm):-Math.sqrt(dm);
  }
}
function distAt(x,y){
  var fx=(x-GX0)/(GX1-GX0)*(GN-1),fy=(y-GY0)/(GY1-GY0)*(GN-1);
  if(fx<0||fy<0||fx>=GN-1||fy>=GN-1)return-1;
  var i=fx|0,j=fy|0,u=fx-i,v=fy-j,g=dgrid,o=j*GN+i;
  return(g[o]*(1-u)+g[o+1]*u)*(1-v)+(g[o+GN]*(1-u)+g[o+GN+1]*u)*v;
}
function surfH(d){
  var m=d>=BEVEL?1:d/BEVEL,q=1-m,r=Math.sqrt(Math.max(0,1-q*q));
  var dm=d>=BEVEL?0:THICK*q/(BEVEL*Math.max(.03,r)),dd=DOME*Math.min(1,d/14);
  return{h:THICK*r+dd,dh:dm+(d<14?DOME/14:0)};
}
function heartPoint(){
  var x,y,d,sh,g=0,E=.3;
  for(;;){
    x=GX0+Math.random()*(GX1-GX0);y=GY0+Math.random()*(GY1-GY0);d=distAt(x,y);
    if(d<=.01){if(++g>400){x=0;y=2;d=5;sh=surfH(d);break}continue}
    sh=surfH(d);
    var fac=Math.sqrt(1+sh.dh*sh.dh);if(Math.random()*4.6<Math.min(4.6,fac))break;
    if(++g>400)break;
  }
  var gx=(distAt(x+E,y)-distAt(x-E,y))/(2*E),gy=(distAt(x,y+E)-distAt(x,y-E))/(2*E);
  if(d<E*1.5){var gl0=Math.hypot(gx,gy)||1;gx/=gl0;gy/=gl0}
  var hx=sh.dh*gx,hy=sh.dh*gy,nl=Math.hypot(hx,hy,1);
  var lit=clamp01((-hx*LX-hy*LY+LZ)/nl);
  return{x:x,y:y,lit:lit};
}

/* ---- bố cục (tính lại khi đổi cỡ màn hình, không dựng lại hạt) ---- */
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W*.86,H*.57)/36;cx=W/2;cy=H*.40;groundY=H*.90;groundU=(groundY-cy)/scale;
  domeRx=Math.min(W*.42,320)/scale;domeRy=domeRx*.17;
  envW=Math.min(W*.64,320);envH=envW*.68;envCy=H*.64;envTop=envCy-envH/2;etU=(envTop-cy)/scale;
  $('hint').style.top=(groundY+16)+'px';
  retarget();layoutLetter();
}
function retarget(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    p.dx=Math.cos(p.da)*domeRx*p.df;p.dy=groundU-Math.sin(p.da)*domeRy*p.df;
    p.lx=(p.ex*envW+p.jx)/scale;p.ly=(envTop+p.ey*envH+p.jy-cy)/scale;
  }
}
function build(){
  mobile=W<700||('ontouchstart' in window);
  var N=mobile?5400:10500,M=mobile?300:560;
  parts.length=0;motes.length=0;stars.length=0;hearts.length=0;
  if(!dgrid)buildDistGrid();
  var skip=reduce;
  for(var i=0;i<N;i++){
    var q=heartPoint(),hx=q.x*1,hy=q.y*1,r=Math.random(),ex,ey,fl=0,lg=1,sd;
    /* vị trí trên lá thư (toạ độ chuẩn hoá: ex -0.5..0.5, ey 0..1) */
    if(r<.12){sd=Math.random()*3.36;if(sd<1){ex=sd-.5;ey=0}else if(sd<1.68){ex=.5;ey=(sd-1)/.68}else if(sd<2.68){ex=.5-(sd-1.68);ey=1}else{ex=-.5;ey=1-(sd-2.68)/.68}}
    else if(r<.21){var t1=Math.random(),sg=Math.random()<.5?-1:1;ex=sg*.5*(1-t1);ey=.58*t1;fl=1}
    else if(r<.26){var t2=Math.random(),sg2=Math.random()<.5?-1:1;ex=sg2*.5*(1-t2);ey=1-.46*t2}
    else if(r<.38){var u1=Math.random(),u2=Math.random();if(u1+u2>1){u1=1-u1;u2=1-u2}ex=-.5+u1+(u2*.5);ey=.58*u2*0+u2*.58;ex=(u1-u2*.0)*0;ex=(Math.random()-.5)*(1-ey/.58);fl=1;lg=0}
    else{ex=Math.random()-.5;ey=Math.random();lg=0}
    var a=Math.random()*3.14159,f=Math.random()<.45?.86+Math.random()*.14:Math.pow(Math.random(),.55)*.86;
    parts.push({hx:hx,hy:hy,hl:q.lit,da:a,df:f,ex:ex,ey:ey,fl:fl,lg:lg,jx:(Math.random()-.5)*(lg?4.4:0),jy:(Math.random()-.5)*(lg?4.4:0),dx:0,dy:0,lx:0,ly:0,
      x:skip?hx:0,y:skip?hy:groundU,vx:0,vy:0,sz:(Math.random()<.12?2.3:1.45)+Math.random()*.9,
      ph:Math.random()*6.283,sp:.7+Math.random()*1.8,v:(Math.random()*8)|0});
  }
  for(var m=0;m<M;m++)motes.push({x:(Math.random()-.5)*W*1.02,j:Math.random(),rise:Math.random()<.22?(18+Math.random()*120):0,ph:Math.random()*6.283,sp:.5+Math.random()*2,sz:.7+Math.random()*1.4,v:(Math.random()*8)|0,sd:Math.random()});
  for(var s=0;s<(mobile?55:100);s++)stars.push({x:Math.random(),y:Math.random()*.8,r:.2+Math.random()*.9,ph:Math.random()*6.28,sp:.4+Math.random()*1.2});
  for(var h=0;h<(mobile?14:22);h++)hearts.push({x:Math.random(),y:Math.random(),s:7+Math.random()*13,sp:16+Math.random()*30,ph:Math.random()*6.28,w:8+Math.random()*16,red:Math.random()<.6});
  makeFloats();
  /* khởi tạo vị trí ban đầu theo vòm (hạt nằm sát đường chân trời) */
  retarget();
  for(var j=0;j<parts.length;j++){var p=parts[j];if(!skip){p.x=p.dx*(.6+Math.random()*.8);p.y=groundU+Math.random()*.6}}
  elapsed=skip?T_HINT+1:0;phase=skip?1:0;
  if(!sprites)sprites={gold:heartSprite('255,200,70'),pink:heartSprite('255,105,150'),red:heartSprite('255,52,78')};
}
/* chữ + ảnh nhỏ bay lên quanh trái tim đỏ, lấy từ chính lời chúc */
function makeFloats(){
  floats.length=0;thumbs.length=0;
  var words=(title+' '+msg).replace(/\s+/g,' ').trim().split(' ').filter(Boolean),phr=[],i=0;
  while(i<words.length){var n=2+((Math.random()*2)|0);phr.push(words.slice(i,i+n).join(' '));i+=n}
  if(!phr.length)phr=['❤'];
  var cnt=mobile?12:18;
  for(var k=0;k<cnt;k++)floats.push({t:phr[k%phr.length],x:.1+Math.random()*.8,off:Math.random()*H*1.2,sp:16+Math.random()*26,sz:12+Math.random()*7,ph:Math.random()*6.28});
  imgs.slice(0,4).forEach(function(u){var im=new Image();im.referrerPolicy='no-referrer';im.src=u;thumbs.push({im:im,x:.12+Math.random()*.76,off:Math.random()*H,sp:14+Math.random()*16,sz:26+Math.random()*12})});
}
function drawFloats(e,wa){
  ctx.save();ctx.textAlign='center';
  for(var i=0;i<floats.length;i++){
    var f=floats[i],cyc=H*1.1,y=((H*1.02-(e*f.sp+f.off))%cyc+cyc)%cyc-H*.04,u=clamp01(y/H),edge=Math.sin(Math.PI*u);
    var a=Math.pow(Math.max(0,edge),.8)*(.45+.4*Math.abs(Math.sin(e*.7+f.ph)))*wa;if(a<.02)continue;
    ctx.globalCompositeOperation='lighter';ctx.font='500 '+f.sz+'px "Dancing Script","Segoe Script","Brush Script MT",cursive';
    ctx.shadowColor='rgba(255,40,70,.9)';ctx.shadowBlur=8;ctx.fillStyle='rgba(255,95,115,'+a+')';
    ctx.fillText(f.t,f.x*W+Math.sin(e*.6+f.ph)*10,y);
  }
  ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
  for(var j=0;j<thumbs.length;j++){
    var t=thumbs[j],im=t.im;if(!(im.complete&&im.naturalWidth))continue;
    var cyc2=H*1.1,y2=((H*1.02-(e*t.sp+t.off))%cyc2+cyc2)%cyc2-H*.04,a2=Math.pow(Math.max(0,Math.sin(Math.PI*clamp01(y2/H))),.8)*.6*wa;if(a2<.02)continue;
    var s=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-s)/2,sy=(im.naturalHeight-s)/2;
    ctx.globalAlpha=a2;ctx.drawImage(im,sx,sy,s,s,t.x*W-t.sz/2,y2-t.sz/2,t.sz,t.sz);
  }
  ctx.restore();
}

/* ---- DOM của lá thư: ảnh bay ra + chữ gõ từng dòng ---- */
function hintShow(t){var h=$('hint');if(t)h.textContent=t;h.classList.add('show')}
function hintHide(){$('hint').classList.remove('show')}
function playAudio(){if(audio&&audio.paused)audio.play().catch(function(){})}
function layoutLetter(){
  if(!letterBuilt)return;
  var ps=document.querySelectorAll('#pols .pol'),n=ps.length;
  var w=n<=1?Math.min(W*.46,210):n===2?Math.min(W*.38,170):Math.min(W*.3,128);
  var mid=(n-1)/2,step=n>1?Math.min(w*.84,(W-w-24)/(n-1)):0,y0=H*.265;
  for(var i=0;i<n;i++){
    var p=ps[i];
    p.style.setProperty('--w',w+'px');p.style.setProperty('--tx',(cx+(i-mid)*step)+'px');p.style.setProperty('--ty',(y0+Math.abs(i-mid)*(n>2?9:0))+'px');
    p.style.setProperty('--r',((i-mid)*(n>2?7:5)+(i%2?1.5:-1.5))+'deg');p.style.setProperty('--sx',cx+'px');p.style.setProperty('--sy',(envCy-envH*.1)+'px');p.style.setProperty('--dl',(i*.18)+'s');
  }
  $('txt').style.top=(H*.47)+'px';
}
function buildLetter(){
  var host=$('letter');host.innerHTML='';
  var pols=document.createElement('div');pols.id='pols';var tx=document.createElement('div');tx.id='txt';
  host.appendChild(pols);host.appendChild(tx);
  imgs.forEach(function(u){
    var p=document.createElement('div');p.className='pol';
    var im=document.createElement('img');im.alt='';im.referrerPolicy='no-referrer';im.src=u;im.onerror=function(){p.remove();layoutLetter()};
    p.appendChild(im);pols.appendChild(p);
    p.addEventListener('click',function(e){e.stopPropagation();var l=$('light');l.querySelector('img').src=u;l.style.display='grid'});
  });
  letterBuilt=true;layoutLetter();
  setTimeout(function(){host.classList.add('go')},reduce?0:700);
  setTimeout(typeLines,reduce?0:1300);
}
var typeLinesData=[];
function typeLines(){
  var host=$('txt'),lines=[];if(!host)return;
  if(title)lines.push({h:1,t:title});
  String(msg).split('\n').forEach(function(s){s=s.trim();if(s)lines.push({h:0,t:s})});
  typeLinesData=lines;typingDone=false;
  var total=0;lines.forEach(function(l){total+=l.t.length});var speed=total>260?24:total>140?32:40,i=0;
  function later(fn,ms){var id=setTimeout(fn,ms);typeTimers.push(id)}
  function nextLine(){
    if(i>=lines.length){typingDone=true;return}
    var L=lines[i++],el=document.createElement(L.h?'h2':'p');if(L.h)el.className='h';el.classList.add('c');host.appendChild(el);
    var ch=Array.from(L.t),j=0;
    (function tick(){el.textContent+=ch[j++];if(j<ch.length)later(tick,speed);else{el.classList.remove('c');later(nextLine,L.h?520:340)}})();
  }
  if(reduce){finishTyping();return}
  nextLine();
}
function finishTyping(){
  typeTimers.forEach(clearTimeout);typeTimers=[];
  var host=$('txt');if(!host||typingDone)return;
  host.innerHTML='';typeLinesData.forEach(function(L){var el=document.createElement(L.h?'h2':'p');if(L.h)el.className='h';el.textContent=L.t;host.appendChild(el)});
  typingDone=true;
}

/* ---- các lần chạm ---- */
function advance(){
  if(phase===1){ /* tim đỏ -> vỡ thành bụi vàng -> lá thư */
    phase=2;tPh=elapsed;flashT=elapsed;hintHide();playAudio();
    for(var i=0;i<parts.length;i++){var p=parts[i],d=Math.hypot(p.x,p.y)||1,m=.6+Math.random()*3.2;p.vx+=p.x/d*m+(Math.random()-.5)*.6;p.vy+=p.y/d*m+(Math.random()-.5)*.6}
  }else if(phase===3){ /* lá thư mở -> ảnh + chữ */
    phase=4;t4=elapsed;stage.classList.add('open');hintHide();buildLetter();
  }else if(phase>=4){finishTyping()}
}
stage.addEventListener('pointerup',function(e){
  if(e.target.closest&&e.target.closest('.pol'))return;
  if(style==='flower'){open();return}
  advance();
});

function frame(now){
  if(!lastTime)lastTime=now;
  var dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;elapsed+=dt;
  var e=elapsed,k=dt*60;
  if(phase===0&&e>T_RED+.6)phase=1;
  if(phase===2&&e>tPh+2.4){phase=3;hintShow('Chạm vào lá thư nhé 💌')}
  if(phase===1&&!hint1&&e>T_HINT){hint1=true;hintShow('Chạm vào trái tim nha ❤')}
  ctx.clearRect(0,0,W,H);
  /* màu: vàng -> trắng vàng -> đỏ; sau khi chạm quay về vàng */
  var c0=T_FORM-.2,ciT=phase>=2?1:(e<c0?0:(e<T_RED?(e-c0)/(T_RED-c0)*8:8+Math.min(1,(e-T_RED)/1.5)*(PAL_N-9)));
  if(phase<2)ciCur=ciT;else ciCur+=(ciT-ciCur)*Math.min(1,dt*5);
  var ci=Math.round(ciCur),pal=phase>=2?PALP:PAL[ci],redness=Math.max(0,(ciCur-8)/(PAL_N-9)),intro=Math.min(1,e/1.1),groundIn=clamp01((e-1.2)/1.5)*intro;
  for(var i=0;i<stars.length;i++){var s0=stars[i];ctx.globalAlpha=(.12+.34*Math.abs(Math.sin(e*s0.sp+s0.ph)))*intro;ctx.fillStyle='#fff';ctx.fillRect(s0.x*W,s0.y*H,s0.r*1.6,s0.r*1.6)}
  ctx.globalCompositeOperation='lighter';
  var domeG=Math.min(1,e/2.8);domeG=1-Math.pow(1-domeG,3);
  var op=phase>=4?easeIO(clamp01((e-t4)/1.0)):0;
  /* quầng sáng */
  if(phase===0&&e<T_RED+.3){
    var ha=(e<T_FORM?.3*domeG:.3*(1-Math.min(1,(e-T_FORM)/(T_RED-T_FORM))*.5)),hy=e<T_FORM?groundY-domeRy*scale*.45*domeG:groundY+(cy-groundY)*Math.min(1,Math.max(0,(e-T_FORM)/(T_FLASH-T_FORM)));
    var hr=Math.max(40,domeRx*scale*(1.1+.5*(e>T_FORM?Math.min(1,(e-T_FORM)/1.8):0)));
    var gr=ctx.createRadialGradient(cx,hy,0,cx,hy,hr);gr.addColorStop(0,'rgba(255,205,90,'+ha+')');gr.addColorStop(1,'rgba(255,170,40,0)');
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(cx-hr,hy-hr,hr*2,hr*2);
  }
  if(redness>0){
    var beatH=1+(phase<=1?Math.pow(Math.max(0,Math.sin(e*2.4)),8)*.05:0),rr0=21*scale*beatH;
    var g2=ctx.createRadialGradient(cx,cy,rr0*.15,cx,cy,rr0);g2.addColorStop(0,'rgba(255,25,60,'+(.42*redness)+')');g2.addColorStop(.55,'rgba(255,20,70,'+(.18*redness)+')');g2.addColorStop(1,'rgba(255,20,70,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g2;ctx.fillRect(cx-rr0,cy-rr0,rr0*2,rr0*2);
  }
  if(phase>=2){ /* ánh sáng vàng quanh lá thư, sáng hơn khi mở nắp */
    var gA=(phase===2?clamp01((e-tPh-.4)/1.4):1)*(.2+.2*op),gR=envW*1.15,gY=envCy+op*H*.13,g4=ctx.createRadialGradient(cx,gY,0,cx,gY,gR);
    g4.addColorStop(0,'rgba(255,110,165,'+gA+')');g4.addColorStop(1,'rgba(255,80,140,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g4;ctx.fillRect(cx-gR,gY-gR,gR*2,gR*2);
  }
  if(groundIn>0)for(var m=0;m<motes.length;m++){
    var mo=motes[m],cyc=(e*.07*mo.sp+mo.sd)%1,yy=groundY+(mo.j-.5)*7;
    if(mo.rise)yy-=cyc*mo.rise;
    var al0=(mo.rise?(1-cyc):1)*(.25+.6*Math.abs(Math.sin(e*mo.sp*1.6+mo.ph)))*groundIn*(1-Math.abs(mo.x)/(W*.62));
    ctx.globalAlpha=Math.max(0,al0);ctx.fillStyle=pal[mo.v];ctx.fillRect(cx+mo.x,yy,mo.sz,mo.sz);
  }
  /* hạt */
  var toDome=phase===0&&e<T_FORM,inEnv=phase>=2,spring,damp;
  if(phase===0){if(e<T_FORM){spring=.022;damp=.86}else if(e<T_RED){spring=.012+.03*Math.min(1,(e-T_FORM)/1.6);damp=.86}else{spring=.018;damp=.82}}
  else if(phase===1){spring=.018;damp=.82}
  else if(phase===2&&e<tPh+.5){spring=.006;damp=.94}
  else{spring=.03;damp=.84}
  damp=Math.pow(damp,k);var sk=spring*k,cth=Math.cos(op*3.0);
  var beat=1+(!inEnv&&e>T_RED?Math.pow(Math.max(0,Math.sin(e*2.4)),8)*.045:0);
  var envA=phase>=4?1-.72*ease3(clamp01((e-t4)/1.5)):1,shU=op*H*.13/scale;
  for(var j=0;j<parts.length;j++){
    var p=parts[j],tx,ty;
    if(toDome){tx=p.dx*domeG;ty=groundU+(p.dy-groundU)*domeG-Math.sin(e*2+p.ph)*.5}
    else if(!inEnv){tx=p.hx;ty=p.hy}
    else{tx=p.lx;ty=p.ly+shU;if(p.fl&&phase>=4)ty=etU+(p.ly-etU)*cth+shU}
    p.vx=(p.vx+(tx-p.x)*sk)*damp;p.vy=(p.vy+(ty-p.y)*sk)*damp;p.x+=p.vx*k;p.y+=p.vy*k;
    var px=cx+p.x*scale*beat,py=cy+p.y*scale*beat,tw=.55+.45*Math.abs(Math.sin(e*p.sp+p.ph)),al,lit;
    if(inEnv){al=tw*(p.lg?1:.5)*envA;lit=.7}else{lit=p.hl;al=tw*(.55+.8*lit)*intro*(e>T_RED?1.18:1)}
    ctx.globalAlpha=al>1?1:al;ctx.fillStyle=pal[Math.min(7,p.v+((lit*2.6)|0))];
    var r=p.sz;
    if(r<1.35)ctx.fillRect(px-r*.5,py-r*.5,r,r);else{ctx.beginPath();ctx.arc(px,py,r*.6,0,6.283);ctx.fill()}
  }
  /* chữ + ảnh nhỏ bay lên (chỉ ở màn tim đỏ) */
  var wa=phase<2?clamp01((e-T_RED-.3)/1.2):(phase===2?clamp01(1-(e-tPh)/.5):0);
  if(wa>0)drawFloats(e,wa);
  ctx.globalCompositeOperation='lighter';
  /* tim nhỏ bay lên: vàng lúc đầu, đỏ/hồng sau đó */
  if(e>1.8){
    var fa=Math.min(1,(e-1.8)/1.5);
    for(var h=0;h<hearts.length;h++){
      var ht=hearts[h],sprite=phase>=2?sprites.pink:ci<10?sprites.gold:(ht.red?sprites.red:sprites.pink),yy2=((ht.y*H*1.1-(e*ht.sp))%(H*.95)+H*.95)%(H*.95)+H*.02,xx=ht.x*W+Math.sin(e*.8+ht.ph)*ht.w;
      var ya=Math.min(1,Math.max(0,(groundY+30-yy2)/90));
      ctx.globalAlpha=(.25+.6*Math.abs(Math.sin(e*.9+ht.ph)))*fa*ya;ctx.drawImage(sprite,xx-ht.s,yy2-ht.s,ht.s*2,ht.s*2);
    }
  }
  /* chớp sáng: lúc tim hình thành và lúc chạm vào tim */
  var f0=T_FORM+.6,fl=0,fx=cx,fy=cy;
  if(phase===0&&e>f0&&e<T_RED+1.3)fl=e<T_FLASH?Math.pow((e-f0)/(T_FLASH-f0),2.2):Math.max(0,1-(e-T_FLASH)/1.1);
  if(e-flashT<.6)fl=Math.max(fl,.85*(1-(e-flashT)/.6));
  if(fl>0){
    var fr=Math.max(W,H)*(.28+.4*fl),g3=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
    g3.addColorStop(0,'rgba(255,250,235,'+(.95*fl)+')');g3.addColorStop(.35,'rgba(255,225,150,'+(.5*fl)+')');g3.addColorStop(1,'rgba(255,200,100,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g3;ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  raf=requestAnimationFrame(frame);
}
/* ---------- bó hoa (SVG tự vẽ) ---------- */
function tulip(x,y,s,rot,c1,c2){
  return '<path d="M'+x+' '+y+' C'+x+' '+(y+90)+' 150 250 150 330" stroke="#5aa467" stroke-width="4.5" fill="none" stroke-linecap="round"/>'+
  '<g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><g class="bloom">'+
  '<path d="M-22 0C-27 -30 -14 -54 0 -64C14 -54 27 -30 22 0C12 9 -12 9 -22 0Z" fill="'+c2+'"/>'+
  '<path d="M-22 0C-25 -26 -13 -47 -3 -60C-5 -32 -3 -10 1 7C-10 7 -19 4 -22 0Z" fill="'+c1+'"/>'+
  '<path d="M22 0C25 -26 13 -47 3 -60C5 -32 3 -10 -1 7C10 7 19 4 22 0Z" fill="'+c1+'" opacity=".93"/>'+
  '</g></g>';
}
function drawFlower(){
  var g='<defs><linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f5"/><stop offset=".48" stop-color="#ff9fbd"/><stop offset="1" stop-color="#e94d83"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5f5c9"/><stop offset="1" stop-color="#27875a"/></linearGradient><radialGradient id="petalGlow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ff6f9a" stop-opacity="0"/></radialGradient><filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  g+='<ellipse cx="150" cy="290" rx="105" ry="118" fill="url(#petalGlow)" opacity=".6"/>'; 
  g+='<path d="M150 330C110 290 70 280 52 238C98 240 136 275 150 330Z" fill="url(#leaf)"/>';
  g+='<path d="M150 330C190 290 230 280 248 238C202 240 164 275 150 330Z" fill="url(#leaf)"/>';
  g+=tulip(64,222,1.12,-26,'#ff8fb1','#ffd3e0');
  g+=tulip(236,222,1.12,26,'#ff7ea6','#ffc4d7');
  g+=tulip(104,172,1.3,-12,'#ffffff','#ffe3ec');
  g+=tulip(196,172,1.3,12,'#ff9db9','#ffd8e3');
  g+=tulip(150,138,1.5,0,'#ff6f9a','#ffb7cd');
  g+='<path d="M72 252Q150 232 228 252L170 396Q150 405 130 396Z" fill="url(#wrap)" stroke="#fff0f5" stroke-width="2"/>';
  g+='<path d="M72 252Q112 300 130 396L150 330Z" fill="#ffb3c8" opacity=".75"/>';
  g+='<path d="M228 252Q188 300 170 396L150 330Z" fill="#ffd9e4" opacity=".8"/>';
  g+='<path d="M150 372C140 363 134 357 134 350C134 345 138 342 142 342C146 342 149 345 150 347C151 345 154 342 158 342C162 342 166 345 166 350C166 357 160 363 150 372Z" fill="#f0507a"/>';
  g+='<path d="M120 296Q150 306 180 296" stroke="#f0507a" stroke-width="5" fill="none" stroke-linecap="round"/>';
  g+='<g fill="#fff" filter="url(#softGlow)" opacity=".9"><circle cx="78" cy="170" r="2.4"/><circle cx="220" cy="160" r="2"/><circle cx="150" cy="95" r="2.8"/><circle cx="105" cy="245" r="1.8"/><circle cx="205" cy="225" r="2.2"/></g>';
  $('flower').innerHTML='<svg viewBox="0 0 300 420" aria-hidden="true">'+g+'</svg>';
  $('hint').style.top=($('flower').getBoundingClientRect().bottom+8)+'px';
}

/* ---------- mở lời chúc ---------- */
function floatHearts(){
  if(reduce)return;
  var n=0,iv=setInterval(function(){
    var h=document.createElement('div');h.className='fh';h.textContent=style==='flower'?(Math.random()<.5?'🌸':'💗'):'❤';
    h.style.left=(Math.random()*96)+'%';h.style.fontSize=(14+Math.random()*16)+'px';
    h.style.color='#ff6f97';h.style.setProperty('--t',(5+Math.random()*4)+'s');h.style.setProperty('--x',(Math.random()*60-30)+'px');
    stage.appendChild(h);setTimeout(function(){h.remove()},9500);
    if(++n>60)clearInterval(iv);
  },380);
}
function typeText(el,text){
  var chars=Array.from(text);el.textContent='';
  if(reduce||chars.length>300){el.textContent=text;return}
  var i=0,iv=setInterval(function(){el.textContent+=chars[i++];if(i>=chars.length)clearInterval(iv)},38);
}
function open(){
  if(opened)return;opened=true;stage.classList.add('open');
  $('title').textContent=title;$('title').hidden=!title;
  typeText($('msg'),msg);floatHearts();
  if(audio&&audio.paused)audio.play().catch(function(){});
}

/* ---------- khởi động ---------- */
function start(){
  if(style==='heart'){buildPalette();resize();build();lastTime=0;raf=requestAnimationFrame(frame);var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,120)})}
  else{drawFlower();$('hint').classList.add('show')}
  var l=$('loading');l.style.opacity='0';setTimeout(function(){l.hidden=true},500);
}
document.addEventListener('visibilitychange',function(){
  if(style!=='heart')return;
  if(document.hidden){cancelAnimationFrame(raf);lastTime=0}else{lastTime=0;raf=requestAnimationFrame(frame)}
});
setTimeout(function(){
  if(pin){
    $('loading').hidden=true;var lk=$('lock');lk.hidden=false;var inp=$('pin');
    inp.addEventListener('input',function(){
      inp.value=inp.value.replace(/\D/g,'');
      if(inp.value.length===4){
        if(inp.value===pin){lk.hidden=true;$('loading').hidden=false;$('loading').style.opacity='1';start()}
        else{$('pinErr').textContent='Chưa đúng mã rồi, thử lại nhé 🥺';inp.value=''}
      }
    });
  }else start();
},reduce?0:700);
})();
</script>
